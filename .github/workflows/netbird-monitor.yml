name: NetBird monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: netbird-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les peers
        env:
          NETBIRD_TOKEN: ${{ secrets.NETBIRD_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WATCH_PEERS: ${{ secrets.WATCH_PEERS }}
          CONFIRMATIONS: "1"
          STATE_FILE: netbird_state.json
        run: python3 netbird_monitor.py --once

      - name: Sauvegarder l'état
        run: |
          git config user.name "netbird-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add netbird_state.json
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 3
            done
          fi